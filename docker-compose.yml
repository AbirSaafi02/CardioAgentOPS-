version: "3.8"

services:
  # API Gateway: entry point and web interface
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8001
      ORCHESTRATOR_URL: http://agent-orchestrator:8002
    depends_on:
      - audio-engine
    networks:
      - cardio-net
    restart: always

  # Audio Engine: preprocessing and ONNX inference
  audio-engine:
    build:
      context: ./audio-engine
      dockerfile: Dockerfile
    container_name: audio-engine
    ports:
      - "8001:8001"
    volumes:
      - ./audio-engine/models:/app/models
    environment:
      MODEL_PATH: models/cardio_model.onnx
    networks:
      - cardio-net
    restart: always

  # MLflow: MLOps registry and tracking
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000
    networks:
      - cardio-net
    restart: always

networks:
  cardio-net:
    driver: bridge
